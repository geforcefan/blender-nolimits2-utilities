name: build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: python -m pip install numpy pytest
      - name: Run the tests
        run: python -m pytest

  extension:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          curl -sL https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-5.2.1-linux-x64" >> "$GITHUB_PATH"
      - name: Pack the extension
        run: |
          mkdir -p dist
          blender --command extension build --source-dir . --output-dir dist
          blender --command extension server-generate --repo-dir=dist --html
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.zip

  pages:
    needs: extension
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

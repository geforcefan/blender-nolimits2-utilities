name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            wheel_platform: macosx_arm64
            macos_arch: arm64
          - runner: macos-14
            wheel_platform: macosx_x86_64
            macos_arch: x86_64
          - runner: windows-2022
            wheel_platform: win_amd64
          - runner: windows-11-arm
            wheel_platform: win_arm64
          - runner: ubuntu-24.04
            wheel_platform: manylinux_x86_64
          - runner: ubuntu-24.04-arm
            wheel_platform: manylinux_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: blender/nolimits2
        env:
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS_MACOS: ${{ matrix.macos_arch }}
          CIBW_TEST_SKIP: "*x86_64*"
          CIBW_BUILD_FRONTEND: build
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_ARCHS_LINUX: auto64
          CIBW_ARCHS_WINDOWS: ${{ matrix.runner == 'windows-11-arm' && 'ARM64' || 'AMD64' }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: python -c "import nolimits2; print(nolimits2.Park)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.wheel_platform }}
          path: wheelhouse/*.whl

  extension:
    needs: wheels
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: wheelhouse
          pattern: wheel-*
          merge-multiple: true
      - name: Install Blender
        run: |
          curl -sL https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz | tar -xJ
          echo "$PWD/blender-5.2.0-linux-x64" >> "$GITHUB_PATH"
      - name: Pack the extension
        run: |
          python blender/tools/pack_extension.py --wheels wheelhouse --output dist
          blender --command extension server-generate --repo-dir=dist --html
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*.zip

  pages:
    needs: extension
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

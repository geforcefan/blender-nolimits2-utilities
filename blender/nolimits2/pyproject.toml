[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "nolimits2"
version = "0.1.0"
description = "NoLimits 2 park reader and track curve"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Ercan Akyürek", email = "ercan.akyuerek@gmail.com" }]

[project.urls]
Repository = "https://github.com/geforcefan/blender-nolimits2-utilities"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build-wheel/{wheel_tag}"
wheel.py-api = "cp312"
cmake.build-type = "Release"
